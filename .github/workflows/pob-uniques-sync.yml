name: Sync PoB unique lines with APT

# Weekly: applies Awakened PoE Trade's changes to scripts/pob-uniques.ndjson on a branch and opens an issue that lists
# them, with a link to open the PR (the org doesn't let Actions create PRs)
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CI: true
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/pob-uniques-sync.ts --message "$RUNNER_TEMP/message"
      - name: Push a branch and open an issue when a unique changed in APT
        run: |
          [ -f "$RUNNER_TEMP/message" ] || exit 0
          branch="pob-uniques-sync/$(cat scripts/pob-uniques.apt-sha | cut -c1-7)"
          git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null && exit 0
          node scripts/pob-stats.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add scripts/pob-uniques.ndjson scripts/pob-uniques.apt-sha public/pob-stats.ndjson
          git commit -F "$RUNNER_TEMP/message"
          git push origin "$branch"
          tests=$(pnpm test 2>&1 | tail -5)
          gh issue create --title "$(head -1 "$RUNNER_TEMP/message")" --body "Branch \`$branch\` has this sync; [open the PR](https://github.com/$GITHUB_REPOSITORY/compare/main...$branch?expand=1), review the changes and merge.

          $(tail -n +3 "$RUNNER_TEMP/message")

          \`pnpm test\` on this branch:
          \`\`\`
          $tests
          \`\`\`"
